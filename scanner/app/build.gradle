apply plugin: 'com.android.application'

configurations { natives }
def arcore_libpath = "../../arcore"

android {
    compileSdk = 35
    buildToolsVersion = "35.0.0"
    ndkVersion = "25.1.8937393"
    defaultConfig {
        // A separate id lets the MAX build coexist with the historic Play Store app,
        // whose signing key is not part of this repository.
        applicationId = "com.roellinracing.scannermax"
        namespace ="com.lvonasek.arcore3dscanner"
        minSdkVersion 24
        targetSdkVersion 35
        manifestPlaceholders = ['appAuthRedirectScheme': 'https://lvonasek.github.io/redirect.html']
        multiDexEnabled true
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildFeatures {
            buildConfig true
        }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    // AGP 8.1 aligns uncompressed JNI entries to 4 KB. Extracting compressed
    // libraries is Android's documented fallback for 16 KB-page devices until
    // the legacy native dependency stack can move to AGP 8.5.1+/NDK r28+.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    // Public, non-production key for the sideloaded MAX debug package. Keeping
    // this key stable lets every CI artifact update the previous installation
    // instead of Android rejecting each build because of a random runner key.
    signingConfigs {
        scannerMaxDebug {
            storeFile file('scannermax-debug.keystore')
            storePassword 'scannermax-debug'
            keyAlias 'scannermax'
            keyPassword 'scannermax-debug'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.scannerMaxDebug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += '../../common/ar/'
        main.java.srcDirs += '../../common/record/'
        main.java.srcDirs += '../../common/utils/'
    }
}

dependencies {
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    // Keep Java and native ARCore binaries on the same, Android-16-ready release.
    implementation 'com.google.ar:core:1.54.0'
    natives 'com.google.ar:core:1.54.0'
    implementation 'com.huawei.hms:arenginesdk:3.5.0.1'
    implementation files('src/main/libs/sdk-base-1.190.0.aar')
    implementation 'net.openid:appauth:0.11.1'

    implementation 'org.jcodec:jcodec:0.2.3'
    implementation 'org.jcodec:jcodec-android:0.2.3'
}

task extractNativeLibraries() {
    // Always extract, this insures the native libs are updated if the version changes.
    outputs.upToDateWhen { false }
    doFirst {
        configurations.natives.files.each { f ->
            copy {
                from zipTree(f)
                into arcore_libpath
                include "jni/**/*"
            }
        }
    }
}

tasks.whenTaskAdded {
    task-> if (task.name.contains("external") && !task.name.contains("Clean")) {
        task.dependsOn(extractNativeLibraries)
    }
}
