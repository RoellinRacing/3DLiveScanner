name: Android Scanner APK

on:
  push:
    branches:
      - codex/full-reengineering-v3
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: scanner
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;25.1.8937393'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"
      - name: Compile unit-test sources
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Android lint
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Name APK and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/3DLiveScanner-Max.apk
          (cd app/build/outputs/apk/debug && sha256sum 3DLiveScanner-Max.apk > 3DLiveScanner-Max.apk.sha256)
      - name: Upload installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 3DLiveScanner-Max-${{ github.sha }}
          path: |
            scanner/app/build/outputs/apk/debug/3DLiveScanner-Max.apk
            scanner/app/build/outputs/apk/debug/3DLiveScanner-Max.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 3DLiveScanner-lint-${{ github.sha }}
          path: scanner/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
